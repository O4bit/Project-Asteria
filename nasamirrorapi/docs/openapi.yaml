openapi: 3.0.0
info:
  title: NASA Mirror API
  version: 0.1.0
  description: |
    A secure Cloudflare Workers API that scrapes and exposes APOD (Astronomy Picture of the Day) 
    content from the NCKU mirror as JSON, modeled after NASA's official API.
  contact:
    name: API Support
    url: https://github.com/yourusername/nasa-mirror-api
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://nasa-mirror-api.yourusername.workers.dev
    description: Production server
  - url: http://localhost:8787
    description: Local development server

tags:
  - name: APOD
    description: Astronomy Picture of the Day endpoints

paths:
  /:
    get:
      summary: API Information
      description: Returns basic information about the API and available endpoints
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: NASA Mirror API
                  version:
                    type: string
                    example: 0.1.0
                  endpoints:
                    type: object
                  documentation:
                    type: string

  /apod/latest:
    get:
      tags:
        - APOD
      summary: Get Latest APOD Entry
      description: |
        Returns the most recent Astronomy Picture of the Day entry from the cache.
        Supports conditional requests using ETag and If-None-Match headers.
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
          description: ETag from previous response. Returns 304 if content unchanged.
          example: "a1b2c3d4e5f6"
        - in: header
          name: If-Modified-Since
          schema:
            type: string
            format: date-time
          description: RFC 2822 timestamp. Returns 304 if not modified since.
          example: "Sat, 05 Oct 2024 12:00:00 GMT"
      responses:
        '200':
          description: Latest APOD entry
          headers:
            ETag:
              schema:
                type: string
              description: Content hash for caching
            Cache-Control:
              schema:
                type: string
              description: Caching directives
              example: "public, max-age=3600"
            Last-Modified:
              schema:
                type: string
                format: date-time
              description: Timestamp of last cache update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApodEntry'
              example:
                date: "2024-10-05"
                title: "NGC 1365: A Barred Spiral Galaxy"
                explanation: "<p>NGC 1365 is a giant barred spiral galaxy...</p>"
                explanation_text: "NGC 1365 is a giant barred spiral galaxy..."
                media_type: "image"
                url: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/image/2410/ngc1365.jpg"
                hdurl: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/image/2410/ngc1365_hd.jpg"
                source_url: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/apod.html"
                extracted_at: "2024-10-05T12:00:00Z"
                copyright: "John Doe"
        '304':
          description: Not Modified (content unchanged since last request)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Rate limit exceeded: 100 requests per 60 seconds"
                status: 429
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /apod/{date}:
    get:
      tags:
        - APOD
      summary: Get APOD Entry by Date
      description: |
        Returns the Astronomy Picture of the Day for a specific date.
        Date must be in ISO 8601 format (YYYY-MM-DD).
      parameters:
        - in: path
          name: date
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Date in YYYY-MM-DD format
          example: "2024-10-01"
        - in: header
          name: If-None-Match
          schema:
            type: string
          description: ETag from previous response
        - in: header
          name: If-Modified-Since
          schema:
            type: string
            format: date-time
          description: RFC 2822 timestamp
      responses:
        '200':
          description: APOD entry for specified date
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=86400"
            Last-Modified:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApodEntry'
        '304':
          description: Not Modified
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid date format: 2024-13-01. Expected YYYY-MM-DD"
                status: 400
        '404':
          description: APOD entry not found for specified date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "APOD entry not found for date: 2024-10-01"
                status: 404
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ApodEntry:
      type: object
      required:
        - date
        - title
        - explanation
        - explanation_text
        - media_type
        - url
        - source_url
        - extracted_at
      properties:
        date:
          type: string
          format: date
          description: Date of the APOD entry in YYYY-MM-DD format (ISO 8601)
          example: "2024-10-05"
        title:
          type: string
          description: Title of the APOD entry
          example: "NGC 1365: A Barred Spiral Galaxy"
        explanation:
          type: string
          description: Explanation in HTML format (sanitized)
          example: "<p>NGC 1365 is a giant barred spiral galaxy about 56 million light-years away...</p>"
        explanation_text:
          type: string
          description: Plain text version of the explanation
          example: "NGC 1365 is a giant barred spiral galaxy about 56 million light-years away..."
        media_type:
          type: string
          enum:
            - image
            - video
          description: Type of media (image or video)
          example: "image"
        url:
          type: string
          format: uri
          description: URL of the primary media (image or video)
          example: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/image/2410/ngc1365.jpg"
        hdurl:
          type: string
          format: uri
          nullable: true
          description: URL of high-definition version (optional, for images)
          example: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/image/2410/ngc1365_hd.jpg"
        thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL of thumbnail image (optional, typically for videos)
          example: "https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg"
        source_url:
          type: string
          format: uri
          description: URL of the original APOD page
          example: "http://sprite.phys.ncku.edu.tw/astrolab/mirrors/apod_e/apod.html"
        extracted_at:
          type: string
          format: date-time
          description: Timestamp when the data was extracted (UTC, ISO 8601)
          example: "2024-10-05T12:00:00Z"
        copyright:
          type: string
          nullable: true
          description: Copyright information (optional)
          example: "Copyright: John Doe Photography"

    ErrorResponse:
      type: object
      required:
        - error
        - status
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid date format"
        status:
          type: integer
          description: HTTP status code
          example: 400
        details:
          type: string
          nullable: true
          description: Additional error details (optional)
          example: "Expected format: YYYY-MM-DD"

  securitySchemes: {}

security: []
